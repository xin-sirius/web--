<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS · 李某 | 数字名片</title>
<style>
/* ============================================================
   NEXUS · PRO 数字名片   |   粒子 · 3D 倾斜 · 故障 · 雷达
   ============================================================ */

:root{
  --bg:     #03050a;
  --cyan:   #00e5ff;
  --violet: #7b5cff;
  --mint:   #31ffc8;
  --pink:   #ff3ea5;

  --text:   #e9f2ff;
  --text-2: rgba(162, 202, 242, .88);
  --text-3: #6f809a;
  --line:   rgba(120, 170, 255, .16);
  --ease:   cubic-bezier(.2, .8, .25, 1);
}

*,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }

body{
  min-height: 100vh;
  padding: 48px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
               "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  cursor: none;
}

/* ---------------- 自定义光标 ---------------- */
.cursor,
.cursor-dot{
  position: fixed;
  top: 0; left: 0;
  pointer-events: none;
  z-index: 9999;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  mix-blend-mode: screen;
}
.cursor{
  width: 36px; height: 36px;
  border: 1px solid rgba(0, 229, 255, .75);
  box-shadow: 0 0 18px rgba(0, 229, 255, .55);
  transition: width .25s var(--ease), height .25s var(--ease),
              background .25s var(--ease), border-color .25s var(--ease);
}
.cursor.is-hot{
  width: 60px; height: 60px;
  background: rgba(0, 229, 255, .10);
  border-color: rgba(49, 255, 200, .90);
}
.cursor-dot{
  width: 5px; height: 5px;
  background: var(--cyan);
  box-shadow: 0 0 12px var(--cyan);
}

/* 移动端隐藏自定义光标，恢复默认 */
@media (hover: none){
  body{ cursor: auto; }
  .cursor, .cursor-dot{ display: none; }
}

/* ---------------- 背景层 ---------------- */
.bg{
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}

/* 粒子网络 */
#net{
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: .85;
}

/* 网格 */
.bg-grid{
  position: absolute;
  inset: -64px;
  background-image:
    linear-gradient(rgba(0, 229, 255, .05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 229, 255, .05) 1px, transparent 1px);
  background-size: 48px 48px;
  -webkit-mask-image: radial-gradient(ellipse 70% 62% at 50% 45%, #000 0%, transparent 80%);
          mask-image: radial-gradient(ellipse 70% 62% at 50% 45%, #000 0%, transparent 80%);
  animation: gridDrift 26s linear infinite;
}
@keyframes gridDrift{
  to{ background-position: 48px 48px, 48px 48px; }
}

/* 光球 */
.orb{
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
}
.orb-a{
  width: 540px; height: 540px;
  top: -180px; left: -140px;
  background: radial-gradient(circle, rgba(0, 229, 255, .55), transparent 68%);
  animation: orbFloat 20s ease-in-out infinite;
}
.orb-b{
  width: 640px; height: 640px;
  right: -240px; bottom: -260px;
  background: radial-gradient(circle, rgba(123, 92, 255, .50), transparent 68%);
  animation: orbFloat 26s ease-in-out infinite reverse;
}
.orb-c{
  width: 380px; height: 380px;
  top: 55%; left: 50%;
  background: radial-gradient(circle, rgba(49, 255, 200, .26), transparent 70%);
  animation: orbPulse 14s ease-in-out infinite;
}
@keyframes orbFloat{
  0%, 100%{ transform: translate(0, 0) scale(1); }
  50%     { transform: translate(50px, 40px) scale(1.1); }
}
@keyframes orbPulse{
  0%, 100%{ opacity: .45; transform: translate(-50%, -50%) scale(1); }
  50%     { opacity: .85; transform: translate(-50%, -50%) scale(1.15); }
}

.bg-vignette{
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 90% 80% at 50% 45%,
              transparent 32%,
              rgba(2, 4, 10, .92) 100%);
}

/* ---------------- 舞台 / 卡片 ---------------- */
.stage{
  position: relative;
  z-index: 1;
  width: 100%;
  display: flex;
  justify-content: center;
  perspective: 1400px;
}

.card{
  position: relative;
  width: min(580px, 100%);
  padding: 1px;
  border-radius: 28px;
  background: linear-gradient(140deg,
              rgba(0, 229, 255, .85) 0%,
              rgba(123, 92, 255, .40) 34%,
              rgba(0, 229, 255, .06) 58%,
              rgba(49, 255, 200, .75) 100%);
  box-shadow:
    0 30px 100px -30px rgba(0, 200, 255, .60),
    0 0 160px -60px rgba(123, 92, 255, .80);
  animation: cardIn 1s var(--ease) both;
  transform-style: preserve-3d;
  will-change: transform;
  transition: box-shadow .5s var(--ease);
}
@keyframes cardIn{
  from{ opacity: 0; transform: translateY(34px) scale(.94) rotateX(6deg); }
  to  { opacity: 1; transform: translateY(0) scale(1) rotateX(0deg); }
}

/* 鼠标跟随的镜面高光 */
.card__glare{
  position: absolute;
  inset: 1px;
  border-radius: 27px;
  background: radial-gradient(circle 240px at var(--mx, 50%) var(--my, 50%),
              rgba(0, 229, 255, .22), transparent 65%);
  opacity: 0;
  transition: opacity .35s var(--ease);
  pointer-events: none;
  z-index: 3;
  mix-blend-mode: screen;
}
.card:hover .card__glare{ opacity: 1; }

.card__aura{
  position: absolute;
  inset: -20px;
  z-index: 0;
  border-radius: 48px;
  background: linear-gradient(140deg,
              rgba(0, 229, 255, .55),
              rgba(123, 92, 255, .35) 45%,
              rgba(49, 255, 200, .45));
  filter: blur(46px);
  opacity: .55;
  animation: auraPulse 7s ease-in-out infinite;
}
@keyframes auraPulse{
  0%, 100%{ opacity: .38; transform: scale(.99); }
  50%     { opacity: .70; transform: scale(1.015); }
}

/* ---------------- 卡片内层 ---------------- */
.card__inner{
  position: relative;
  z-index: 1;
  padding: 26px 30px 30px;
  border-radius: 27px;
  background: linear-gradient(180deg, rgba(10, 18, 32, .95), rgba(4, 8, 16, .98));
  -webkit-backdrop-filter: blur(18px);
          backdrop-filter: blur(18px);
  overflow: hidden;
  transform-style: preserve-3d;
}

/* 扫描细纹 */
.card__inner::before{
  content: "";
  position: absolute;
  inset: 0;
  background-image: linear-gradient(rgba(140, 200, 255, .04) 1px, transparent 1px);
  background-size: 100% 4px;
  opacity: .6;
  pointer-events: none;
}

/* 纵向扫描光带 */
.card__inner::after{
  content: "";
  position: absolute;
  left: 0; right: 0;
  height: 180px;
  top: -180px;
  background: linear-gradient(180deg, transparent, rgba(0, 229, 255, .08), transparent);
  pointer-events: none;
  animation: scan 6.5s linear infinite;
}
@keyframes scan{
  0%  { top: -180px; }
  100%{ top: 105%; }
}

/* 四角装饰 */
.corner{
  position: absolute;
  width: 20px; height: 20px;
  border: 2px solid rgba(0, 229, 255, .80);
  filter: drop-shadow(0 0 6px rgba(0, 229, 255, .9));
  pointer-events: none;
  z-index: 4;
}
.corner--tl{ top: 12px;    left: 12px;   border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
.corner--tr{ top: 12px;    right: 12px;  border-left: 0;  border-bottom: 0; border-radius: 0 8px 0 0; }
.corner--bl{ bottom: 12px; left: 12px;   border-right: 0; border-top: 0;    border-radius: 0 0 0 8px; }
.corner--br{ bottom: 12px; right: 12px;  border-left: 0;  border-top: 0;    border-radius: 0 0 8px 0; }

/* ---------------- 顶部状态栏 ---------------- */
.topbar{
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  letter-spacing: .16em;
  text-transform: uppercase;
}

.tag{
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: rgba(180, 220, 255, .75);
  font-weight: 500;
}

.dot{
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 10px var(--cyan), 0 0 20px rgba(0, 229, 255, .6);
  animation: blink 2.2s ease-in-out infinite;
}
@keyframes blink{
  0%, 100%{ opacity: 1; }
  50%     { opacity: .25; }
}

.status{
  position: relative;
  padding-left: 14px;
  color: var(--mint);
  font-weight: 600;
  text-shadow: 0 0 12px rgba(49, 255, 200, .65);
}
.status::before{
  content: "";
  position: absolute;
  left: 0; top: 50%;
  width: 6px; height: 6px;
  border-radius: 50%;
  transform: translateY(-50%);
  background: var(--mint);
  box-shadow: 0 0 10px var(--mint);
  animation: blink 1.6s ease-in-out infinite;
}

/* ---------------- 头像 + 信息 ---------------- */
.profile{
  position: relative;
  display: flex;
  align-items: center;
  gap: 28px;
  margin-top: 28px;
  transform-style: preserve-3d;
}

/* 头像 */
.avatar{
  position: relative;
  flex: 0 0 auto;
  width: 132px; height: 132px;
  display: grid;
  place-items: center;
  transform: translateZ(30px);
}

/* 雷达扫描弧 */
.avatar::before{
  content: "";
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  background: conic-gradient(from 0deg,
              transparent 0deg,
              transparent 300deg,
              rgba(0, 229, 255, .55) 340deg,
              rgba(0, 229, 255, .95) 360deg);
  -webkit-mask: radial-gradient(circle, transparent 62%, #000 63%, #000 100%);
          mask: radial-gradient(circle, transparent 62%, #000 63%, #000 100%);
  animation: spin 4s linear infinite;
  filter: drop-shadow(0 0 8px rgba(0, 229, 255, .9));
}

.avatar__core{
  position: relative;
  z-index: 2;
  width: 96px; height: 96px;
  border-radius: 50%;
  overflow: hidden;
  background: #0a1220;
  border: 1px solid rgba(0, 229, 255, .60);
  box-shadow:
    0 0 30px rgba(0, 229, 255, .42),
    inset 0 0 26px rgba(0, 229, 255, .22);
}
.avatar__core img{
  width: 100%; height: 100%;
  display: block;
  object-fit: cover;
}

.ring{
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}
.ring--dash{
  inset: 0;
  border: 1px dashed rgba(0, 229, 255, .40);
  animation: spin 22s linear infinite;
}
.ring--glow{
  inset: 11px;
  border: 1px solid rgba(123, 92, 255, .60);
  box-shadow: 0 0 20px rgba(123, 92, 255, .50);
  animation: spin 14s linear infinite reverse;
}
.ring--pulse{
  inset: 3px;
  border: 1px solid rgba(0, 229, 255, .45);
  animation: pulseRing 3.2s ease-out infinite;
}
@keyframes spin{
  to{ transform: rotate(360deg); }
}
@keyframes pulseRing{
  0%  { transform: scale(.88); opacity: .90; }
  100%{ transform: scale(1.42); opacity: 0; }
}

/* 文字信息 */
.meta{
  min-width: 0;
  flex: 1 1 auto;
  transform: translateZ(20px);
}

.name{
  position: relative;
  font-size: clamp(26px, 5.4vw, 34px);
  font-weight: 800;
  line-height: 1.15;
  letter-spacing: .02em;
  background: linear-gradient(100deg, #ffffff 0%, #9fe9ff 30%, #7b5cff 55%, #ffffff 100%);
  background-size: 220% 100%;
  -webkit-background-clip: text;
          background-clip: text;
  color: transparent;
  animation: shine 7s linear infinite;
}

/* 故障光效层 */
.name::before,
.name::after{
  content: attr(data-text);
  position: absolute;
  inset: 0;
  background: inherit;
  -webkit-background-clip: text;
          background-clip: text;
  color: transparent;
  pointer-events: none;
}
.name::before{
  color: rgba(0, 229, 255, .85);
  -webkit-text-fill-color: rgba(0, 229, 255, .85);
  background: none;
  clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
  animation: glitchTop 4.5s infinite steps(1);
  opacity: 0;
}
.name::after{
  color: rgba(255, 62, 165, .85);
  -webkit-text-fill-color: rgba(255, 62, 165, .85);
  background: none;
  clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
  animation: glitchBot 4.5s infinite steps(1);
  opacity: 0;
}
@keyframes glitchTop{
  0%, 92%, 100%{ opacity: 0; transform: translate(0, 0); }
  93%{ opacity: 1; transform: translate(-2px, -1px); }
  95%{ opacity: 1; transform: translate(2px, 1px); }
  97%{ opacity: 1; transform: translate(-1px, 0); }
}
@keyframes glitchBot{
  0%, 92%, 100%{ opacity: 0; transform: translate(0, 0); }
  94%{ opacity: 1; transform: translate(2px, 1px); }
  96%{ opacity: 1; transform: translate(-2px, -1px); }
  98%{ opacity: 1; transform: translate(1px, 0); }
}

@keyframes shine{
  to{ background-position: 220% 0; }
}

.role{
  margin-top: 8px;
  font-size: 13px;
  letter-spacing: .04em;
  color: var(--text-2);
}

/* 打字机副标题 */
.motto{
  margin-top: 10px;
  font-size: 12px;
  line-height: 1.65;
  color: var(--text-3);
  font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
  min-height: 1.65em;
}
.motto::after{
  content: "▊";
  color: var(--cyan);
  margin-left: 2px;
  animation: caret 1s steps(1) infinite;
}
@keyframes caret{
  0%, 50%{ opacity: 1; }
  51%, 100%{ opacity: 0; }
}

.chips{
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
  list-style: none;
}
.chips li{
  padding: 4px 11px;
  font-size: 11px;
  letter-spacing: .08em;
  color: rgba(190, 228, 255, .88);
  border-radius: 999px;
  border: 1px solid rgba(0, 229, 255, .28);
  background: linear-gradient(180deg, rgba(0, 229, 255, .12), rgba(0, 229, 255, .02));
  box-shadow: inset 0 0 12px rgba(0, 229, 255, .10);
  transition: border-color .3s var(--ease), color .3s var(--ease), transform .3s var(--ease);
}
.chips li:hover{
  color: #ffffff;
  border-color: rgba(0, 229, 255, .80);
  transform: translateY(-2px);
}

/* ---------------- 能力指标 ---------------- */
.metrics{
  position: relative;
  display: grid;
  gap: 13px;
  margin-top: 28px;
}

.metric{
  display: grid;
  grid-template-columns: 100px 1fr 46px;
  align-items: center;
  gap: 12px;
}

.metric__key{
  font-size: 10px;
  letter-spacing: .14em;
  color: var(--text-3);
  font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
}

.metric__track{
  position: relative;
  height: 6px;
  border-radius: 999px;
  background: rgba(120, 170, 255, .10);
  box-shadow: inset 0 0 0 1px rgba(120, 170, 255, .10);
  overflow: hidden;
}

.metric__track i{
  position: absolute;
  left: 0; top: 0; bottom: 0;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--cyan), var(--violet));
  box-shadow: 0 0 16px rgba(0, 229, 255, .65);
  transform-origin: left center;
  animation: fillBar 1.6s var(--ease) both;
}
.metric__track i::after{
  content: "";
  position: absolute;
  top: 0; bottom: 0;
  width: 42px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .85), transparent);
  animation: sweep 2.8s ease-in-out infinite;
}
@keyframes fillBar{
  from{ transform: scaleX(0); }
  to  { transform: scaleX(1); }
}
@keyframes sweep{
  0%       { left: -42px; }
  55%, 100%{ left: 100%; }
}

.metric:nth-child(1) .metric__track i{ width: 88%; animation-delay: .30s; }
.metric:nth-child(2) .metric__track i{ width: 82%; animation-delay: .45s; }
.metric:nth-child(3) .metric__track i{ width: 76%; animation-delay: .60s; }

.metric__val{
  text-align: right;
  font-size: 11px;
  color: rgba(0, 229, 255, .95);
  text-shadow: 0 0 10px rgba(0, 229, 255, .60);
  font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
  font-variant-numeric: tabular-nums;
}

/* ---------------- 联系方式 ---------------- */
.contact{
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 28px;
  padding-top: 22px;
  border-top: 1px solid var(--line);
}

.contact__item{
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-radius: 14px;
  text-decoration: none;
  color: var(--text);
  font-size: 13px;
  letter-spacing: .02em;
  background: linear-gradient(180deg, rgba(255, 255, 255, .055), rgba(255, 255, 255, .015));
  border: 1px solid rgba(120, 170, 255, .16);
  overflow: hidden;
  transition:
    transform .35s var(--ease),
    border-color .35s var(--ease),
    box-shadow .35s var(--ease),
    background .35s var(--ease);
}
.contact__item::before{
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, transparent 30%, rgba(0, 229, 255, .22) 50%, transparent 70%);
  transform: translateX(-130%);
  transition: transform .75s ease;
  pointer-events: none;
}
.contact__item:hover::before{ transform: translateX(130%); }
.contact__item:hover{
  transform: translateY(-3px);
  border-color: rgba(0, 229, 255, .60);
  background: linear-gradient(180deg, rgba(0, 229, 255, .10), rgba(0, 229, 255, .02));
  box-shadow: 0 14px 36px -14px rgba(0, 229, 255, .75);
}

.contact__ico{
  flex: 0 0 auto;
  width: 28px; height: 28px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  font-size: 13px;
  color: #04121a;
  background: linear-gradient(140deg, var(--cyan), var(--mint));
  box-shadow: 0 0 18px rgba(0, 229, 255, .60);
}

.contact__txt{
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ---------------- 响应式 ---------------- */
@media (max-width: 560px){
  body{ padding: 32px 16px; }
  .card__inner{ padding: 22px 20px 24px; }

  .profile{
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 20px;
  }
  .chips{ justify-content: center; }

  .metric{ grid-template-columns: 78px 1fr 42px; gap: 10px; }
  .contact{ grid-template-columns: 1fr; }
  .corner{ width: 14px; height: 14px; }
}

/* ---------------- 减少动态 ---------------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}
</style>
</head>
<body>

  <!-- 自定义光标 -->
  <div class="cursor" aria-hidden="true"></div>
  <div class="cursor-dot" aria-hidden="true"></div>

  <!-- 背景 -->
  <div class="bg" aria-hidden="true">
    <canvas id="net"></canvas>
    <div class="bg-grid"></div>
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="bg-vignette"></div>
  </div>

  <!-- 名片 -->
  <main class="stage">
    <article class="card" id="card">

      <div class="card__aura" aria-hidden="true"></div>

      <div class="card__inner">

        <div class="card__glare" aria-hidden="true"></div>

        <span class="corner corner--tl" aria-hidden="true"></span>
        <span class="corner corner--tr" aria-hidden="true"></span>
        <span class="corner corner--bl" aria-hidden="true"></span>
        <span class="corner corner--br" aria-hidden="true"></span>

        <header class="topbar">
          <span class="tag"><i class="dot"></i>NEXUS · ID CARD</span>
          <span class="status">ONLINE</span>
        </header>

        <section class="profile">

          <div class="avatar">
            <span class="ring ring--pulse" aria-hidden="true"></span>
            <span class="ring ring--dash" aria-hidden="true"></span>
            <span class="ring ring--glow" aria-hidden="true"></span>
            <div class="avatar__core">
              <img alt="李某的头像"
                   src="img_1.jpg">
            </div>
          </div>

          <div class="meta">
            <h1 class="name" data-text="李某">李某</h1>
            <p class="role">计算机科学与技术 · 在读</p>
            <p class="motto" id="motto"></p>
            <ul class="chips">
              <li>算法</li>
              <li>前端</li>
              <li>人工智能</li>
            </ul>
          </div>

        </section>

        <section class="metrics" aria-label="能力指标">
          <div class="metric">
            <span class="metric__key">ALGORITHM</span>
            <span class="metric__track"><i></i></span>
            <span class="metric__val">88%</span>
          </div>
          <div class="metric">
            <span class="metric__key">FRONTEND</span>
            <span class="metric__track"><i></i></span>
            <span class="metric__val">82%</span>
          </div>
          <div class="metric">
            <span class="metric__key">DATA / AI</span>
            <span class="metric__track"><i></i></span>
            <span class="metric__val">76%</span>

<script>
/* ============================================================
   1. 粒子网络
   ============================================================ */
(function(){
  const canvas = document.getElementById('net');
  const ctx = canvas.getContext('2d');
  let W, H, dots = [];
  const DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize(){
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width  = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const count = Math.min(Math.floor(W * H / 14000), 110);
    dots = Array.from({ length: count }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - .5) * .35,
      vy: (Math.random() - .5) * .35,
      r: Math.random() * 1.4 + .6
    }));
  }

  function tick(){
    ctx.clearRect(0, 0, W, H);

    // 连线
    for (let i = 0; i < dots.length; i++){
      for (let j = i + 1; j < dots.length; j++){
        const a = dots[i], b = dots[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d2 = dx*dx + dy*dy;
        if (d2 < 130 * 130){
          const alpha = (1 - Math.sqrt(d2) / 130) * .28;
          ctx.strokeStyle = `rgba(0, 229, 255, ${alpha})`;
          ctx.lineWidth = .6;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }

    // 点
    for (const d of dots){
      d.x += d.vx;
      d.y += d.vy;
      if (d.x < 0 || d.x > W) d.vx *= -1;
      if (d.y < 0 || d.y > H) d.vy *= -1;
      ctx.fillStyle = 'rgba(120, 220, 255, .85)';
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(tick);
  }

  resize();
  window.addEventListener('resize', resize);
  tick();
})();

/* ============================================================
   2. 自定义光标
   ============================================================ */
(function(){
  const ring = document.querySelector('.cursor');
  const dot  = document.querySelector('.cursor-dot');
  if (!ring || !dot) return;
  if (window.matchMedia('(hover: none)').matches) return;

  let mx = window.innerWidth / 2, my = window.innerHeight / 2;
  let rx = mx, ry = my;

  window.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    dot.style.transform = `translate(${mx}px, ${my}px) translate(-50%, -50%)`;
  });

  (function loop(){
    rx += (mx - rx) * .16;
    ry += (my - ry) * .16;
    ring.style.transform = `translate(${rx}px, ${ry}px) translate(-50%, -50%)`;
    requestAnimationFrame(loop);
  })();

  document.querySelectorAll('a, .chips li, .metric').forEach(el => {
    el.addEventListener('mouseenter', () => ring.classList.add('is-hot'));
    el.addEventListener('mouseleave', () => ring.classList.remove('is-hot'));
  });
})();

/* ============================================================
   3. 卡片 3D 倾斜 + 镜面高光
   ============================================================ */
(function(){
  const card = document.getElementById('card');
  if (!card) return;

  let raf = null;
  let tx = 0, ty = 0, rx = 0, ry = 0;

  function onMove(e){
    const rect = card.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width;
    const py = (e.clientY - rect.top)  / rect.height;

    // 倾斜角度（限制范围）
    tx = (py - .5) * -9;   // rotateX
    ty = (px - .5) *  12;  // rotateY

    card.style.setProperty('--mx', (px * 100) + '%');
    card.style.setProperty('--my', (py * 100) + '%');

    if (!raf) raf = requestAnimationFrame(apply);
  }

  function apply(){
    rx += (tx - rx) * .12;
    ry += (ty - ry) * .12;
    card.style.transform =
      `perspective(1400px) rotateX(${rx}deg) rotateY(${ry}deg) translateZ(0)`;
    raf = requestAnimationFrame(apply);
  }

  function reset(){
    tx = 0; ty = 0;
  }

  card.addEventListener('mousemove', onMove);
  card.addEventListener('mouseleave', reset);
})();

/* ============================================================
   4. 打字机副标题
   ============================================================ */
(function(){
  const el = document.getElementById('motto');
  if (!el) return;
  const text = '// 用代码构建秩序，用设计表达温度';
  let i = 0;

  function type(){
    if (i <= text.length){
      el.textContent = text.slice(0, i);
      i++;
      setTimeout(type, 60);
    } else {
      // 停 2.5 秒后重新开始
      setTimeout(() => { i = 0; el.textContent = ''; type(); }, 2500);
    }
  }

  setTimeout(type, 700);
})();
</script>
